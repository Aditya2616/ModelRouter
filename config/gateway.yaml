# Gateway configuration. Environment variables OPENAI_API_KEY / ANTHROPIC_API_KEY enable hosted tiers.
router_pair: local_qwen            # trained difficulty model in models/ (written by `modelrouter live`); chosen on validation data, see README
router_fallback: gpt35_vs_gpt4     # used when models/router_<router_pair>.joblib does not exist yet
eval_pair: gpt35_vs_gpt4            # offline RouterBench evaluation shown in the UI
tiers:
  small: {provider: local, model: Qwen/Qwen2.5-0.5B-Instruct, price_as: gpt-6-luna}
  big:   {provider: local, model: Qwen/Qwen2.5-1.5B-Instruct, price_as: gpt-6.1-sol}
policy:
  kind: fraction                    # threshold | fraction | budget
  threshold: 0.3                    # send to big when predicted difficulty >= threshold (also the fraction policy's warm-up value)
  target_big_fraction: 0.3          # for kind: fraction
  budget_usd_per_1k: 1.0            # for kind: budget (USD per 1,000 requests)
escalation:
  enabled: true
  min_mean_logprob: -1.6            # local tier: escalate when the answer's mean token logprob is below this
  escalate_on_empty: true
  escalate_on_error: true
cache: {enabled: true, max_items: 512, ttl_seconds: 3600}
generation: {max_tokens: 256, temperature: 0.0}
# Hosted tiers: no model ids are built in. Set them here (or with MODELROUTER_SMALL_MODEL / MODELROUTER_BIG_MODEL),
# add the same ids to pricing.yaml, and set OPENAI_API_KEY or ANTHROPIC_API_KEY. For example:
#   tiers:
#     small: {provider: openai, model: gpt-6-luna}
#     big:   {provider: openai, model: gpt-6.1-sol}
